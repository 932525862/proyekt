name: novalab
services:
  - name: web
    github:
      repo: 932525862/proyekt
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      port: 8080
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    envs:
      - key: DO_APP_PLATFORM
        value: "1"
        scope: RUN_TIME
        type: GENERAL
